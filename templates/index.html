<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Events - Quockerwodger Photography</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .event { margin-bottom: 30px; }
      .event img { max-width: 300px; display: block; margin-top: 10px; }
      hr { margin: 30px 0; }
    </style>
  </head>
  <body>
    <h1>Events</h1>
    {% for event in events %}
      <div class="event">
        <h2>{{ event.artist }} - {{ event.tour }}</h2>
        <p><strong>Venue:</strong> {{ event.venue }}</p>
        <p><strong>Date:</strong> {{ event.event_date.strftime('%B %d, %Y') }}</p>
        <p>
          <a href="{{ event.behance_link }}" target="_blank">View Event on Behance</a>
        </p>
        <img src="{{ event.image_url }}" alt="{{ event.artist }} - {{ event.tour }}">
      </div>
      <hr>
    {% else %}
      <p>No events found.</p>
    {% endfor %}
    <p><a href="{{ url_for('add_event') }}">Add New Event</a></p>
  </body>
</html>
